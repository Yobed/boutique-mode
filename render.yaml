services:
  - type: web
    name: boutique-mode
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        value: "2250574243752"
